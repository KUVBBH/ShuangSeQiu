
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      margin: 0;
      padding: 20px 5px 80px 5px;
    }
    h4, h5 {
      text-align: center;
      margin: 10px 0;
      font-weight: normal;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 auto;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 8px 2px;
      text-align: center;
      vertical-align: middle;
    }

    .col-index { width: 18%; }
    .col-red   { width: 60%; }
    .col-blue  { width: 22%; }

    .col-red { white-space: nowrap; }
    .col-index { white-space: nowrap; }  /* 序号禁止折行 */

    .row-even { background-color: #fffbe8; }
    .row-odd  { background-color: #ffffff; }

    .badge-index {
      display: inline-block;
      background-color: #222222;
      color: #ffffff;
      padding: 3px 5px;
      border-radius: 12px;
      font-size: 10px;           /* 再缩小一点，容纳三位数 */
      font-weight: bold;
      line-height: 1.2;
    }

    /* 红球蓝球统一 24px */
    .ball {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      border-radius: 50%;
      color: #ffffff;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin: 1px;
    }
    .ball-red { background-color: #e41e31; }
    .ball-blue { background-color: #0055aa; }  /* 尺寸跟红球完全一致 */
  </style>
</head>
<body>

  <h4>{{ bj_now.strftime('%Y-%m-%d %H:%M:%S') }}</h4>
  <h5>UTC : {{ utc_now.strftime('%Y-%m-%d %H:%M:%S') }}</h5>

  <table>
    <thead>
      <tr>
        <th class="col-index">序号</th>
        <th class="col-red">红球</th>
        <th class="col-blue">蓝球</th>
      </tr>
    </thead>
    <tbody>
      {% for value in lst %}
      <tr class="{{ 'row-even' if loop.index % 2 == 0 else 'row-odd' }}">
        <td class="col-index">
          <span class="badge-index">第{{ loop.index }}注</span>
        </td>
        <td class="col-red">
          {% for red in value[:-1] %}
          <span class="ball ball-red">{{ red }}</span>
          {% endfor %}
        </td>
        <td class="col-blue">
          <span class="ball ball-blue">{{ value[-1] }}</span>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
