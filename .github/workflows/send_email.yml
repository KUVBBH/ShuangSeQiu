
name: 每天定时发送双色球

on:
   schedule:
    # 每天自动执行
    #- cron: '15 22 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮运行一次，用来测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: 运行发送邮件脚本
      run: python ShuangSeQiu.py
      env:
        # 把 GitHub 里的加密机密传入到 Python 环境变量中
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        SENDER: ${{ secrets.SENDER }}
        RECEIVER: ${{ secrets.RECEIVER }}
