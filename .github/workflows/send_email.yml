
name: SSQ Daily Mail

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 运行发送邮件脚本
        run: |
          pip install jinja2
          python ssq.py
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
